name: Publish plugin release

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Release Linux x86_64
        type: boolean
        default: false
      version_linux:
        description: Linux version tag, for example v0.1.0
        type: string
        default: ''
      macos:
        description: Release macOS arm64
        type: boolean
        default: false
      version_macos:
        description: macOS version tag, for example v0.1.0
        type: string
        default: ''
      windows:
        description: Release Windows x86_64
        type: boolean
        default: false
      version_windows:
        description: Windows version tag, for example v0.1.0
        type: string
        default: ''
      pi_version:
        description: '@earendil-works/pi-coding-agent npm dist-tag or exact version to bundle'
        type: string
        default: latest
      herdr_version:
        description: 'herdr GitHub release tag to bundle (latest or for example v0.9.1)'
        type: string
        default: latest
      prerelease:
        description: Create a prerelease without publishing to the license server
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        shell: bash
        run: echo "matrix=$(./scripts/ci-plan.sh)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_LINUX: ${{ inputs.linux }}
          RELEASE_MACOS: ${{ inputs.macos }}
          RELEASE_WINDOWS: ${{ inputs.windows }}
          VERSION_LINUX: ${{ inputs.version_linux }}
          VERSION_MACOS: ${{ inputs.version_macos }}
          VERSION_WINDOWS: ${{ inputs.version_windows }}

  build:
    name: Build ${{ matrix.name }} ${{ matrix.version }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build and package (official pi and herdr releases)
        shell: bash
        run: ./scripts/package.sh --platform "$PLATFORM" --version "${RELEASE_TAG#v}" --pi-version "$PI_VERSION" --herdr-version "$HERDR_VERSION"
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ matrix.version }}
          PI_VERSION: ${{ inputs.pi_version }}
          HERDR_VERSION: ${{ inputs.herdr_version }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Test
        shell: bash
        run: |
          cargo test --locked
          node --experimental-strip-types --test tests/unit/*.test.mjs
        env:
          POM_UI_REQUIRE_DIST: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.name }}
          path: |
            dist-release/pom-plugin-harness-${{ matrix.platform }}.${{ matrix.ext }}
            dist-release/pom-plugin-harness-${{ matrix.platform }}.metadata.json
          if-no-files-found: error
          # Os pacotes só passam entre as etapas; a release guarda os definitivos.
          retention-days: 1

  release:
    name: Release ${{ matrix.name }} ${{ matrix.version }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-${{ matrix.name }}
          path: packages
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.version }}
          name: ${{ matrix.version }}
          prerelease: ${{ inputs.prerelease }}
          files: packages/*

  license-server:
    name: License server ${{ matrix.name }} ${{ matrix.version }}
    needs: [plan, build, release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download package from the GitHub release
        shell: bash
        run: |
          mkdir -p dist-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist-release --pattern "pom-plugin-harness-${PLATFORM}.*"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
      - name: Publish package to the license server
        shell: bash
        run: ./scripts/publish-to-license-server.sh --version "$RELEASE_TAG" --platform "$PLATFORM" --artifact "$ARTIFACT" --metadata "$METADATA" --reason "release $RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: dist-release/pom-plugin-harness-${{ matrix.platform }}.${{ matrix.ext }}
          METADATA: dist-release/pom-plugin-harness-${{ matrix.platform }}.metadata.json
          POM_RELEASE_TOKEN: ${{ secrets.POM_RELEASE_TOKEN }}
          POM_RELEASE_API: ${{ secrets.POM_RELEASE_API }}
