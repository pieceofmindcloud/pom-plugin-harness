name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: ./scripts/build-ui.sh
      - name: Rust checks
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Launcher and CSS scoping tests
        run: node --test tests/unit/*.test.mjs

  windows-terminal:
    name: Windows terminal and OpenCode
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Assemble the official Windows runtime
        shell: bash
        run: ./scripts/fetch-runtime.sh --platform windows-x86_64
      - name: Enter through ConPTY and OpenCode tab
        run: node tests/e2e/windows-terminal.mjs
